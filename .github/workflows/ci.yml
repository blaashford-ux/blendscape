name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System packages (Rubber Band CLI, libsndfile)
        run: sudo apt-get update && sudo apt-get install -y rubberband-cli libsndfile1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
