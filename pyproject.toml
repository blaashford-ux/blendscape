[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blendscape"
version = "0.1.0"
description = "Automatic DJ-style blending of an ordered list of audio files."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
dependencies = ["numpy", "scipy", "soundfile", "librosa", "numba"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = ["pytest", "ruff", "httpx", "fastapi", "uvicorn[standard]", "python-multipart"]

[project.scripts]
blendscape = "blendscape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blendscape = ["webui/**/*"]  # the built web UI, copied in by scripts/bundle_ui.py when a release is built

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end renders (need the rubberband executable)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["spike"]  # throwaway milestone-0 prototype

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
